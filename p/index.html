<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>HUMKIN × SIA · LITTLE PACKET</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;background:#f3e7d4;color:#30213e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:25px}
main{max-width:530px;width:100%;background:#fff9ed;border:2px solid #30213e;border-radius:15px;padding:clamp(22px,6vw,45px);box-shadow:8px 8px 0 #cfa5a0}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
h1{font-family:Georgia,serif;font-size:clamp(37px,8vw,60px);line-height:1.02;margin:24px 0}
p{line-height:1.55}.links{display:grid;gap:12px;margin-top:25px}
a.gift{display:block;padding:15px 17px;border:2px solid #30213e;border-radius:8px;background:#d6ebde;color:#30213e;text-decoration:none;font-weight:800}
a.gift:focus-visible{outline:4px solid #bb5b7c;outline-offset:3px}
.held{padding:12px;background:#f2e8dd;border-radius:8px}
footer{margin-top:30px;font-size:12px;opacity:.8}
</style></head><body><main>
<div class="eyebrow">LITTLE PACKET · A small gift</div>
<h1 id="title">Opening your packet…</h1>
<p id="note" aria-live="polite">Checking the current approved destinations.</p>
<div id="links" class="links"></div>
<footer>Given freely. No account needed. Nothing must be scanned to receive a physical gift.<br>
A printed QR is a doorway, not a guarantee that a recording or hosting service will remain available forever.</footer>
</main><script type="module">
const title = document.querySelector('#title'), note = document.querySelector('#note'),
  links = document.querySelector('#links');
const id = new URLSearchParams(location.search).get('id');
function showError(message){ title.textContent='This packet is not available';note.textContent=message; }
const safe = url => {
  try { const u=new URL(url); return u.protocol==='https:'&&!u.username&&!u.password&&
    ![...u.searchParams.keys()].some(k=>/^(token|access_token|password|secret|sig|signature|api_key|key|code)$/i.test(k)); }
  catch { return false; }
};
if (!id || !/^[a-z0-9](?:[a-z0-9-]{2,38}[a-z0-9])$/.test(id)) {
 showError('Check the address printed on your card.');
} else {
 try {
  const response=await fetch('./registry.json',{cache:'no-store',credentials:'omit'});
  if (!response.ok) throw Error('The packet registry is currently unreachable.');
  const registry=await response.json();
  if (registry.schema!=='sia/linkbank/v0' || !Array.isArray(registry.packets) || !Array.isArray(registry.assets))
    throw Error('Packet registry format is not recognized.');
  const packet=registry.packets.find(p=>p.id===id);
  if (!packet) { showError('There is no public packet at this address.'); }
  else {
   title.textContent=packet.title;
   note.textContent=packet.note||'A little something for you.';
   for(const item of packet.items||[]) {
    const asset=registry.assets.find(a=>a.id===item.asset_id);
    const current=asset?.locations?.at(-1)?.url;
    if(asset?.status==='active' && safe(current)) {
      const link=document.createElement('a');
      link.className='gift'; link.href=current; link.rel='noopener noreferrer';
      link.referrerPolicy='no-referrer'; link.textContent='OPEN · '+asset.title;
      links.append(link);
    } else {
      const held=document.createElement('p');
      held.className='held';held.textContent='This recording is temporarily unavailable.';
      links.append(held);
    }
   }
  }
 } catch(error){showError(error?.message||'Please try again later.');}
}
</script></body></html>
