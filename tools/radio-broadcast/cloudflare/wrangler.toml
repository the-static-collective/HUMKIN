name = "humkin-long-wave"
main = "worker.mjs"
compatibility_date = "2026-11-17"
workers_dev = true

# The binding is internal; it doesn't use an R2 secret in browser code.
[[r2_buckets]]
binding = "RADIO_MEDIA"
bucket_name = "humkin-radio-media"

# Live HLS uploader uses its own bucket and credentials; never grant it
# write/delete access to the permanent RADIO_MEDIA music archive.
[[r2_buckets]]
binding = "RADIO_LIVE"
bucket_name = "humkin-radio-live"
