plugins {
    id 'com.android.application'
}

android {
    namespace 'org.abundent.humkinradio'
    compileSdk 36

    defaultConfig {
        applicationId 'org.abundent.humkinradio'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '0.20.0'
        resValue 'string', 'app_name', 'HUMKIN RADIO'
    }

    // An independent field-test install avoids Android's rejection when an older
    // CI-generated debug APK has the same package name but a different signing key.
    // This is not a production signing solution; a permanent key is still needed.
    buildTypes {
        fieldTest {
            initWith debug
            applicationIdSuffix '.weather'
            versionNameSuffix '-fieldtest'
            resValue 'string', 'app_name', 'HUMKIN RADIO · WEATHER'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3_version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    testImplementation "junit:junit:4.13.2"
}
