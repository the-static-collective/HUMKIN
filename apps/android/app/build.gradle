plugins {
    id 'com.android.application'
}

android {
    namespace 'org.abundent.humkinradio'
    compileSdk 36

    defaultConfig {
        applicationId 'org.abundent.humkinradio'
        minSdk 26
        targetSdk 36
        versionCode 28
        versionName '0.28.0'
        resValue 'string', 'app_name', 'HUMKIN RADIO'
    }

    // An independent field-test install avoids Android's rejection when an older
    // CI-generated debug APK has the same package name but a different signing key.
    // This is not a production signing solution; a permanent key is still needed.
    buildTypes {
        fieldTest {
            initWith debug
            applicationIdSuffix '.hum'
            versionNameSuffix '-fieldtest'
            resValue 'string', 'app_name', 'HUMKIN · HUM 028'
        }
        // The GitHub Actions debug signature may differ from previous runs.
        // A side-by-side variant lets a listener try Night Watch without
        // uninstalling the earlier Outpost and losing local progress.
        // Separate installation identity: preserves v0.26 Antenna and Night Watch
        // local progress. Reuses the same native player, not a WebView wrapper.
        radioRebel {
            initWith debug
            applicationIdSuffix '.rebel'
            versionNameSuffix '-rebel'
            resValue 'string', 'app_name', 'HUMKIN · RADIO REBEL'
        }
        nightWatch {
            initWith debug
            applicationIdSuffix '.nightwatch'
            versionNameSuffix '-nightwatch'
            resValue 'string', 'app_name', 'HUMKIN · NIGHT WATCH'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3_version = '1.11.1'
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    testImplementation "junit:junit:4.13.2"
    testImplementation 'org.json:json:20240303'
}
