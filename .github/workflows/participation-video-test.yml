name: Participation private video upload check (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/participation-video-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe signed private video upload and finalize without awarding HUM
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse, uuid
          origin='https://humkin.abundent.org'
          endpoint='https://kbhqacsdvjsstzyplqij.supabase.co/functions/v1/humkin-participation'
          listener=str(uuid.uuid4())
          item=None
          def call(body):
            raw=json.dumps(dict(body,listener=listener)).encode()
            req=urllib.request.Request(endpoint,data=raw,method='POST',
              headers={'Origin':origin,'Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=35) as res:return res.status,json.load(res)
            except urllib.error.HTTPError as e:return e.code,json.loads(e.read())
          try:
            status,response=call(dict(action='submit',kind='video',
              title='TEST PRIVATE VIDEO INBOX PLEASE DO NOT APPROVE',
              details='Synthetic media protocol test. Does not contain an authentic contribution.',
              duration=18,rights_confirmed=True,
              file=dict(ext='mp4',mime='video/mp4',size=4096)))
            assert status==200,(status,response)
            item=response['id']
            print('PARTICIPATION_MEDIA_TEST_ID='+item,flush=True)
            upload=response['upload']
            target='https://kbhqacsdvjsstzyplqij.supabase.co/storage/v1/object/upload/sign/humkin-contribution-inbox/'+upload['path']+'?token='+urllib.parse.quote(upload['token'])
            req=urllib.request.Request(target,method='PUT',data=bytes(4096),
              headers={'Content-Type':'video/mp4',
              'apikey':'sb_publishable_Bv9JuOctSQTmnE3O1dP8RA_MKRNSD-o'})
            with urllib.request.urlopen(req,timeout=35) as res:
              print('PRIVATE_MEDIA_UPLOAD_STATUS='+str(res.status),flush=True)
              assert res.status in (200,201)
            status,result=call(dict(action='finalize',id=item))
            assert status==200 and result['state']=='pending_review',(status,result)
            print('PASS: video stays private and awaits reviewer decision; no user minted HUM',flush=True)
          finally:
            if item:
              status,result=call(dict(action='withdraw',id=item))
              print('TEST_MEDIA_WITHDRAWN='+str(status==200 and result.get('withdrawn')),flush=True)
          PY
