name: HUMKIN Station One v2 broadcast policy
on:
  pull_request:
    paths:
      - 'tools/radio-broadcast/**'
      - 'tests/station-one-v2.test.py'
      - 'tests/station-lab.test.py'
      - 'tests/radio-broadcast.test.py'
      - '.github/workflows/station-one-v2.yml'
  push:
    branches: [main]
    paths:
      - 'tools/radio-broadcast/**'
      - 'tests/station-one-v2.test.py'
      - 'tests/station-lab.test.py'
      - '.github/workflows/station-one-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Windows time zone compatibility
        run: python -m pip install tzdata
      - name: Compile Station One sources
        run: python -m compileall -q tools/radio-broadcast
      - name: Current v2 policy, rights gates and station programs
        run: python tests/station-one-v2.test.py
      - name: Hosted HTTPS listener and AzuraCast optionality
        run: python tests/radio-house-host.test.py
      - name: Compile and test TOWER batch/program controls
        run: |
          python tests/tower-batch-programs.test.py
          python tests/tower-cloud-handoff.test.py
          python tests/test_gambit_program_deck.py
          python tests/tower.test.py
          python tests/station-on-air.test.py
          node --check tools/radio-broadcast/on_air.js
      - name: Original continuous-source acceptance
        run: python tests/radio-broadcast.test.py
      - name: Station Desk 0.3 programming lab and private diagnostics
        run: python tests/station-lab.test.py
