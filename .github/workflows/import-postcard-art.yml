name: Import HUMKIN postcard art
on:
  push:
    branches:
      - feature/ten-manga-postcards
    paths:
      - .github/workflows/import-postcard-art.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-original-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ten-manga-postcards
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebP converter
        run: python -m pip install Pillow==11.3.0
      - name: Download and verify uploaded originals, create WebP files
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import Request, urlopen
          from PIL import Image
          entries = [["rainy-song","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/25a1633f-26e9-4037-8214-19cca43dc46f.png","c8445b40c2d02f78c4f4c8d1dad88367b6fc604700ea4d2ad9768255768ca5df"],["thyme","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/10cb6e36-8973-43ef-ac1c-24625144f8dd.png","d22a8eacab87295bebddb5f7c8f93f8d95cddcf74d3a2a53539b2c82209d21ee"],["love","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/b4266f72-5318-4cba-903e-14dd2fd932dd.png","5b885d3d57dfeca4f665f0b21eab942697e1a8d5f2711f83dcd5ac1a021cb47d"],["make-a-little-room","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/bf20ab44-041d-4313-9fe8-f6056a2662e2.png","a17b17a7a10d430607430221885ce9591f12ed351d61f526896e4b4d59ea9688"],["humkin-roses-banner","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/921fad6f-ae74-40cc-88b0-55dd065c00ac.png","77a312d73de475d40a0fa628add2c688cd4369c359e1b9001d8d98ac420b9e27"],["mutant-pop-day","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/517af7f3-5739-4807-8082-0d481438c676.png","d39b43dcfd466cd2079567941a4c7966018149e5d040cc5178bc768be4c8e51b"],["rose-mary","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/1227a447-23c7-46f5-812d-866ec4ec49f9.png","39db1616479f5a1c0ebe0040aaa3528e3194676f11eada533d9fcfe30b1c879d"],["basil","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/5999f2c7-ba3b-476f-9846-32ef3868246b.png","d57a74b21caf107887c0d6cfdfb5f18f732f7a6f06e6bc5bafd84fd3272dcb66"],["mutant-pop-night","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/121dc4ad-378b-4380-b365-5d2c6207d02f.png","1d155f975fe3cd9fc7e1c808d4027b15a0db0aa1a887a2369dbe022206f6de97"],["humkin-vintage-banner","https://d2ol7oe51mr4n9.cloudfront.net/user_3IHYDbqT9IhNV79bXOGjzHozPpF/1da5ccaf-43dd-4a1f-8244-09a680254c40.png","43fa3becda3629778692d8b9a25b6a0b44ffd059cbeb1982f0461e708138c267"]]
          directory = Path("postcards")
          directory.mkdir(exist_ok=True)
          for name, url, expected_sha256 in entries:
              req = Request(url, headers={"User-Agent": "HUMKIN-postcard-import/1.0"})
              with urlopen(req, timeout=60) as response:
                  original = response.read()
              digest = sha256(original).hexdigest()
              if digest != expected_sha256:
                  raise ValueError(f"{name}: source hash mismatch {digest}")
              with Image.open(BytesIO(original)) as image:
                  image.load()
                  if image.format not in ("JPEG", "PNG", "WEBP"):
                      raise ValueError(f"{name}: unsupported input format {image.format}")
                  converted = image.convert("RGB")
                  output = directory / f"{name}.webp"
                  converted.save(output, format="WEBP", quality=86, method=6)
                  print(name, image.size, output.stat().st_size)
          print("Verified all 10 illustration originals, created 10 optimized WebP images.")
          PY
      - name: Commit supplied illustrations to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postcards/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add ten verified HUMKIN manga postcard images"
            git push origin HEAD:feature/ten-manga-postcards
          fi
