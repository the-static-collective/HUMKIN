name: Android R2 playback repair APK
on:
  push:
    branches: ['fix/android-r2-native-playback-035']
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-r2-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r2-receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and unit-test native R2 receiver
        run: gradle -p apps/android --no-daemon :app:assembleRadioR2 :app:testRadioR2UnitTest
      - name: Verify receiver APK
        run: |
          test -s apps/android/app/build/outputs/apk/radioR2/app-radioR2.apk
          ${ANDROID_HOME}/build-tools/35.0.0/aapt dump badging apps/android/app/build/outputs/apk/radioR2/app-radioR2.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: HUMKIN-R2-RECEIVER-v035-APK
          path: apps/android/app/build/outputs/apk/radioR2/app-radioR2.apk
          retention-days: 30
          if-no-files-found: error
