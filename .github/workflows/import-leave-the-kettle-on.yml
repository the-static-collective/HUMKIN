name: One-time import of user-supplied Leave The Kettle On MP3
on:
  push:
    branches: [feat/fm-leave-the-kettle-on-2026-11-13]
    paths:
      - .github/workflows/import-leave-the-kettle-on.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify uploaded recording and commit exact bytes
        shell: bash
        env:
          PUBLIC_SOURCE: https://cdn.openart.ai/openart-uploads/production/attachment-transfers/d21e20b43b741e6489f121c8b5d655b41cc0996936fe0784298f97b9ac09ba14.mp3
        run: |
          set -euo pipefail
          mkdir -p fm/audio
          if [ ! -f fm/audio/leave-the-kettle-on.mp3 ]; then
            curl --fail --location --silent --show-error --retry 3 --max-time 120 "$PUBLIC_SOURCE" -o fm/audio/leave-the-kettle-on.mp3
          fi
          echo 'c855100c353b8f229c0811bf67c079f5e038dca4316b5a08a90cf10225e08d3d  fm/audio/leave-the-kettle-on.mp3' | sha256sum -c -
          test "$(stat -c%s fm/audio/leave-the-kettle-on.mp3)" -eq 3925398
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fm/audio/leave-the-kettle-on.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'audio: import verified Leave The Kettle On MP3'
            git push origin HEAD:feat/fm-leave-the-kettle-on-2026-11-13
          fi
