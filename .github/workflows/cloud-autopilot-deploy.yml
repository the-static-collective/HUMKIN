name: HUMKIN Cloud Autopilot — manual Long Wave Worker deploy
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Explicitly choose DEPLOY_LONG_WAVE to replace the existing Worker code'
        type: choice
        required: true
        default: HOLD
        options:
          - HOLD
          - DEPLOY_LONG_WAVE
permissions:
  contents: read
concurrency:
  group: humkin-long-wave-manual-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_LONG_WAVE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing and Night Shift contracts
        run: |
          node --test tools/radio-broadcast/cloudflare/worker.test.mjs tools/radio-broadcast/cloudflare/receiver.test.mjs tools/radio-broadcast/cloudflare/cloud-autopilot.test.mjs tools/radio-broadcast/cloudflare/night-shift-aircheck.test.mjs
          node --check tools/radio-broadcast/cloudflare/worker.mjs
          node --check tools/radio-broadcast/cloudflare/night-shift-aircheck.mjs
      - name: Require existing account-scoped Cloudflare deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CF_ACCOUNT" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - name: Deploy existing Long Wave Worker with additive Autopilot paths
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools/radio-broadcast/cloudflare
          wranglerVersion: '4.136.3'
          command: deploy
      - name: Read-only route smoke test (unpublished Cloud Autopilot is acceptable)
        run: |
          node --input-type=module <<'JS'
          const root='https://humkin-long-wave.joyvolcanomusic.workers.dev';
          const health=await fetch(root+'/health');
          if(!health.ok)throw Error('Long Wave health failed: '+health.status);
          const api=await fetch(root+'/autopilot/station-one/status');
          const payload=await api.json().catch(()=>({}));
          if(api.status!==200 && api.status!==503)throw Error('Cloud Autopilot route did not deploy: '+api.status);
          if(typeof payload.on_air!=='boolean')throw Error('Cloud Autopilot route not responding with its contract');
          console.log(JSON.stringify({health:'OK',autopilot_http:api.status,autopilot_on_air:payload.on_air,
            detail:payload.error||payload.mode||'schedule seen'}));
          JS
