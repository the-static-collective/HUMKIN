name: HUMKIN Station One Windows launcher validation
on:
  push:
    branches: [main]
    paths:
      - 'tools/radio-broadcast/windows/**'
      - 'tools/radio-broadcast/engine.py'
      - 'tests/radio-broadcast.test.py'
      - '.github/workflows/station-one-windows.yml'
  pull_request:
    paths:
      - 'tools/radio-broadcast/windows/**'
      - 'tools/radio-broadcast/engine.py'
      - 'tests/radio-broadcast.test.py'
      - '.github/workflows/station-one-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-script-syntax:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell script (no execution, no credentials)
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/radio-broadcast/windows/station-one.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows IANA time zone data
        shell: powershell
        run: python -m pip install tzdata
      - name: Test quote-safe timezone preflight under Windows PowerShell
        shell: powershell
        run: |
          & python tools/radio-broadcast/windows/check_timezone.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Command py -ErrorAction SilentlyContinue) {
            # GitHub's py -3 may select a different installed Python than
            # actions/setup-python. That interpreter needs its own tzdata.
            & py -3 -m pip install tzdata
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & py -3 tools/radio-broadcast/windows/check_timezone.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Python planner and PCM offline unit tests
        shell: powershell
        run: python tests/radio-broadcast.test.py
