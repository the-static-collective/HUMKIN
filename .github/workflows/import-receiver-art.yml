name: Import approved HUMKIN face artwork into app assets
on:
  push:
    branches: ['fix/android-030-api30-wallet-and-living-face']
    paths:
      - '.github/workflows/import-receiver-art.yml'
  workflow_dispatch:
jobs:
  bundle-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download approved concept art from Canva design
        run: |
          # Attempt original 864x1536 user-supplied art, not the Canva
          # document's smaller preview. A failed asset fetch never changes
          # the previously committed resource.
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 120 \
            'https://media.canva.com/v2/image-resize/format:JPG/height:1536/quality:90/uri:ifs%3A%2F%2FM%2F15484de4-baeb-49b6-91cf-73a357a16be9/watermark:F/width:864?csig=AAAAAAAAAAAAAAAAAAAAANEff1QjY3NlqdEW9swP81Zf2vwjcNp0HpkkU6LKuoTB&exp=1794951454&osig=AAAAAAAAAAAAAAAAAAAAAOigLGxoEJLAGVcig4XclMAGXJLq9OOZ-b37YdVzS3xT&signer=media-rpc&token=AAIAAU0AJDE1NDg0ZGU0LWJhZWItNDliNi05MWNmLTczYTM1N2ExNmJlOQAAAAABoetxnTDdQZVkLX_B4OuqXxsylabzKs2ajPeTgoK2Qsxq6gsESg&x-canva-quality=thumbnail' -o /tmp/living_receiver_source
          file /tmp/living_receiver_source
          python -m pip -q install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('/tmp/living_receiver_source')
          if src.width<300 or src.height<500:
              raise RuntimeError(f'Canva returned unsuitable resolution: {src.size}')
          if abs(src.width / src.height - 864/1536)>.02:
              raise RuntimeError(f'Canva image has incorrect aspect ratio: {src.size}')
          out=Path('apps/android/app/src/main/res/drawable-nodpi/living_receiver_face.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          src.convert('RGB').resize((864,1536),Image.Resampling.LANCZOS).save(out,optimize=True)
          print(f'BUNDLED {src.size} -> {out.name}: {out.stat().st_size} bytes')
          PY
      - name: Commit radio face as permanent versioned app asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/res/drawable-nodpi/living_receiver_face.png
          if git diff --cached --quiet; then echo 'Artwork already bundled'; else
            git commit -m 'ASSET: bundle approved HUMKIN radio receiver artwork for Android'
            git push origin HEAD:fix/android-030-api30-wallet-and-living-face
          fi
