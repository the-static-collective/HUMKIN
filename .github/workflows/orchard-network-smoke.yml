name: Orchard Network 004 live smoke
on:
  pull_request:
    paths:
      - 'fm/orchard/network.*'
      - 'supabase/functions/humkin-orchard-network/**'
      - 'tests/orchard-network.smoke.mjs'
      - '.github/workflows/orchard-network-smoke.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed identity, privacy, atomic transfers and catalog receipts
        run: node tests/orchard-network.smoke.mjs
