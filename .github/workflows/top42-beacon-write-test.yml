name: Request Beacon write-path one-off verification
on:
  pull_request:
    paths:
      - '.github/workflows/top42-beacon-write-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify a nomination writes, appears on board, cannot double-send, and does not change plays
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, uuid
          url="https://kbhqacsdvjsstzyplqij.supabase.co/functions/v1/humkin-league"
          def call(body=None):
              data=None if body is None else json.dumps(body).encode()
              headers={"Origin":"https://humkin.abundent.org"}
              if data is not None: headers["Content-Type"]="application/json"
              req=urllib.request.Request(url,data=data,headers=headers,
                                          method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code,json.loads(exc.read())
          status,board=call()
          assert status==200 and "beacons" in board
          chosen=next(x["id"] for x in board["catalog"] if x["id"].startswith("crate-"))
          before=next((x["plays"] for x in board["chart"] if x["id"]==chosen),0)
          listener=str(uuid.uuid4())
          status,response=call({"action":"beacon","listener":listener,"track_id":chosen})
          assert status==200 and response["accepted"],(status,response)
          print("BEACON_TEST_ID="+str(response["beacon_id"]),flush=True)
          print("BEACON_TEST_TRACK="+chosen,flush=True)
          status,duplicate=call({"action":"beacon","listener":listener,"track_id":chosen})
          assert status==409,(status,duplicate)
          status,after=call()
          assert status==200
          assert any(x["id"]==chosen and x["nominations"]>=1 for x in after["beacons"]),after["beacons"]
          plays=next((x["plays"] for x in after["chart"] if x["id"]==chosen),0)
          assert plays==before,(plays,before)
          print("PASS: one real request filed, shown on public board, duplicate rejected, chart points unchanged",flush=True)
          PY
