name: Validate HUMKIN site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and checksum-verify new release audio previews
        run: node scripts/assemble-everywhere-near-you.mjs
      - run: node tests/record-shelf.test.mjs
      - run: node tests/site.test.mjs
      - run: node tests/postcard-buttons.test.mjs
      - run: node tests/distribution.test.mjs
      - run: node tests/surprise.test.mjs
      - run: node tests/commons.test.mjs
      - run: node tests/harbor-sources.test.mjs
      - run: python3 scripts/build_dj_pack.py
      - run: node tests/dj.test.mjs
      - run: node tests/radio.test.mjs
      - run: node --check fm/live-station.js
      - run: node tests/main-live-radio.test.mjs
      - run: node --test tests/night-shift-receiver.test.mjs
      - run: node --check fm/night-shift/night-shift.js
      - run: node --check fmstudio/dial.js
      - run: node --check fmstudio/receiver/core.mjs
      - run: node --check fmstudio/receiver/engine.mjs
      - run: node --check fmstudio/receiver/view.mjs
      - run: node --check tools/radio-broadcast/cloudflare/station-registry.mjs
      - run: node --test tests/fmstudio-live-dial.test.mjs tests/fmstudio-station-registry.test.mjs
      - run: node tests/orchard-gambits.test.cjs
      - run: node tests/save-the-hour.test.cjs
      - run: node --check fm/orchard/save-hour-ui.js
      - run: node --check fm/orchard/save-hour-core.js
      - run: node tests/gambit-program-proposals.test.cjs
      - run: node --check fm/orchard/gambit-proposal.js
      - run: node --check fm/orchard/gambit-proposal-ui.js
      - run: python3 -m unittest discover -s tests -p 'test_gambit_program_deck.py' -v
      - run: node tests/radio-primary-layout.test.mjs
      - run: node tests/bumper-brain.test.cjs
      - run: node tests/bumper-relations.test.cjs
      - run: node --check fm/manage/bumper-workbench.js
      - run: node --check fm/bumper-relations.js
      - run: node tests/station-blackbox.test.cjs
      - run: node tests/radio-loader.test.mjs
      - run: node --test tests/tower-sidecars.test.mjs
      - run: node --test tests/night-shift-cloud-publish.test.mjs
      - run: node --check fm/load/tower-sidecars.mjs
      - run: node tests/radio-r2-direct.test.mjs
      - run: node tests/mesh.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_mesh_inventory.py' -v
      - run: node tests/radio-folder-metadata.test.mjs
      - run: node tests/radio-manager.test.mjs
      - run: node tests/radio-studio.test.mjs
      - run: node tests/radio-field-carts.test.mjs
      - run: node tests/radio-bible.test.mjs
      - run: node tests/radio-house.test.mjs
      - run: node tests/radio-line.test.mjs
      - run: node tests/radio-art.test.mjs
      - run: node tests/radio-warm-signal.test.mjs
      - run: node tests/radio-clock.test.mjs
      - run: node tests/living-discography.test.mjs
      - run: python3 -m py_compile tools/radio-broadcast/modal_hour.py
      - run: python3 tests/radio-broadcast.test.py
      - run: python3 tests/radio-house-host.test.py
      - run: python3 tests/radio-house-bridge.test.py
      - run: python3 tests/radio-convert.test.py
      - run: node --check fm/manage/manager.js
      - run: node --check fm/manage/signal-relay-ui.js
      - run: node --check fm/manage/signal-relay-model.mjs
      - run: node --check fmstudio/compost.js
      - run: node --test tests/signal-relay.test.mjs
