name: Validate HUMKIN site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and checksum-verify new release audio previews
        run: node scripts/assemble-everywhere-near-you.mjs
      - run: node tests/record-shelf.test.mjs
      - run: node tests/site.test.mjs
      - run: node tests/postcard-buttons.test.mjs
      - run: node tests/distribution.test.mjs
      - run: node tests/surprise.test.mjs
      - run: node tests/commons.test.mjs
      - run: node tests/harbor-sources.test.mjs
      - run: python3 scripts/build_dj_pack.py
      - run: node tests/dj.test.mjs
      - run: node tests/radio.test.mjs
      - run: node tests/bumper-brain.test.cjs
      - run: node tests/bumper-relations.test.cjs
      - run: node --check fm/manage/bumper-workbench.js
      - run: node --check fm/bumper-relations.js
      - run: node tests/station-blackbox.test.cjs
      - run: node tests/radio-loader.test.mjs
      - run: node tests/radio-manager.test.mjs
      - run: node tests/radio-studio.test.mjs
      - run: node tests/radio-field-carts.test.mjs
      - run: node tests/radio-bible.test.mjs
      - run: node tests/radio-house.test.mjs
      - run: node tests/radio-line.test.mjs
      - run: node tests/radio-art.test.mjs
      - run: node tests/radio-warm-signal.test.mjs
      - run: node tests/radio-clock.test.mjs
      - run: node tests/living-discography.test.mjs
      - run: python3 -m py_compile tools/radio-broadcast/modal_hour.py
      - run: python3 tests/radio-broadcast.test.py
      - run: python3 tests/radio-house-host.test.py
      - run: python3 tests/radio-house-bridge.test.py
      - run: python3 tests/radio-convert.test.py
