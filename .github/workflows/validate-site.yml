name: Validate HUMKIN site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and checksum-verify new release audio previews
        run: node scripts/assemble-everywhere-near-you.mjs
      - run: node tests/site.test.mjs
      - run: node tests/postcard-buttons.test.mjs
      - run: node tests/distribution.test.mjs
      - run: node tests/surprise.test.mjs
      - run: node tests/commons.test.mjs
      - run: node tests/harbor-sources.test.mjs
      - run: python3 scripts/build_dj_pack.py
      - run: node tests/dj.test.mjs
      - run: node tests/radio.test.mjs
