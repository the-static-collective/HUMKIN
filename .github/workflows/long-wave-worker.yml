name: Verify HUMKIN Long Wave Worker
on:
  pull_request:
    paths:
      - 'tools/radio-broadcast/cloudflare/**'
      - 'fm/long-wave/**'
      - 'fm/network/dial*'
      - 'docs/LONG-WAVE-BACKGROUND-STREAM.md'
      - '.github/workflows/long-wave-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax checks
        run: |
          node --check tools/radio-broadcast/cloudflare/cloud-autopilot.mjs
          node --check tools/radio-broadcast/cloudflare/night-shift-aircheck.mjs
          node --check tools/radio-broadcast/cloudflare/worker.mjs
          node --check fm/long-wave/receiver.js
          node --check fm/network/dial.mjs
          node --check fm/network/dial-core.mjs
          node --check tools/radio-broadcast/cloudflare/transmission-ledger.mjs
      - name: Long Wave stream and receiver regression tests
        run: node --test tools/radio-broadcast/cloudflare/worker.test.mjs tools/radio-broadcast/cloudflare/receiver.test.mjs tools/radio-broadcast/cloudflare/cloud-autopilot.test.mjs tools/radio-broadcast/cloudflare/cloud-schedule.test.mjs tools/radio-broadcast/cloudflare/night-shift-aircheck.test.mjs
      - name: Transmission ledger and dial tests
        run: node --test tools/radio-broadcast/cloudflare/transmission-ledger.test.mjs fm/network/dial-core.test.mjs
      - name: Publisher source syntax
        run: python3 -m py_compile tools/radio-broadcast/autopilot_publisher.py
