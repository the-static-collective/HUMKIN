name: Deploy HUMKIN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble verified everywhere-near-you previews
        run: node scripts/assemble-everywhere-near-you.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build downloadable DJ promo crate
        run: python3 scripts/build_dj_pack.py
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for GitHub Pages artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..20}; do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" = "1" ]; then
              echo "Pages artifact available."
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::More than one Pages artifact; do not redeploy this run."
              exit 1
            fi
            sleep 3
          done
          echo "::error::Pages artifact was not indexed within 60 seconds."
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
