name: Android 11 receiver launch smoke
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-11-launch-smoke.yml'
  push:
    branches: ['fix/android-029-startup-recovery']
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-11-launch-smoke.yml'
jobs:
  android-11-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Crash Doctor APK
        run: gradle -p apps/android --no-daemon :app:assembleRadioDoctor
      - name: Launch on Android 11 API 30 and inspect fatal crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r apps/android/app/build/outputs/apk/radioDoctor/app-radioDoctor.apk
            adb logcat -c
            adb shell am force-stop org.abundent.humkinradio.doctor || true
            adb shell am start -n org.abundent.humkinradio.doctor/org.abundent.humkinradio.MainActivity
            sleep 10
            echo '--- DOCTOR PROCESS ---'
            adb shell pidof org.abundent.humkinradio.doctor || true
            echo '--- ANDROID FATAL CRASHES ---'
            adb logcat -d -v time -s AndroidRuntime:E | tee android-fatal.log
            if grep -Eq 'FATAL EXCEPTION|Process: org.abundent.humkinradio.doctor' android-fatal.log; then
              echo 'Android launch crashed; inspect logcat above.'
              exit 1
            fi
            if ! adb shell pidof org.abundent.humkinradio.doctor; then
              echo 'App process exited during startup.'
              exit 1
            fi
            echo 'Android 11 startup smoke: process still alive; no AndroidRuntime fatal exception.'
