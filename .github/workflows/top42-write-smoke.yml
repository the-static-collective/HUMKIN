name: Top 42 write-path verification (temporary)
on:
  pull_request:
    paths:
      - 'fm/top42/edge-function.ts'
      - '.github/workflows/top42-write-smoke.yml'
jobs:
  verify-live-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create and play one explicitly marked test EP (cleanup by operator)
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, uuid
          endpoint="https://kbhqacsdvjsstzyplqij.supabase.co/functions/v1/humkin-league"
          def request(body=None):
              payload=None if body is None else json.dumps(body).encode("utf-8")
              headers={"Origin":"https://humkin.abundent.org"}
              if payload is not None: headers["Content-Type"]="application/json"
              req=urllib.request.Request(endpoint,data=payload,headers=headers,method="POST" if payload else "GET")
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as exc:
                  raise RuntimeError("HTTP "+str(exc.code)+": "+exc.read().decode()) from exc
          data=request()
          assert data["schema"]=="humkin.top42/v1",data
          radio=[x["id"] for x in data["catalog"] if not x["featured"]]
          released=[x["id"] for x in data["catalog"] if x["featured"]]
          assert len(radio)>=4 and len(released)>=2,("Ineligible catalog",len(radio),len(released))
          listener=str(uuid.uuid4())
          selected=radio[:4]+released[:2]
          result=request({"action":"release","listener":listener,"kind":"ep","word_one":"Almost","word_two":"Almost","tracks":selected})
          record=result["record"]
          print("SMOKE_RECORD_ID="+record["id"],flush=True)
          print("Created test record",record["id"],"with",len(record["tracks"]),"songs",flush=True)
          play=request({"action":"play","listener":listener,"source":"playlist","record_id":record["id"],"track_id":selected[0],"seconds":35})
          assert play.get("accepted") is True,play
          verified=request()
          tracks=[x for x in verified["chart"] if x["id"]==selected[0]]
          assert len(tracks)==1 and tracks[0]["playlist"]>=1,tracks
          assert any(x["id"]==record["id"] for x in verified["eps"]),verified["eps"]
          print("PASS: release, counted listen and chart query; TEST RECORD REQUIRES CLEANUP",flush=True)
          PY
