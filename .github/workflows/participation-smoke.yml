name: Participation public intake smoke (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/participation-smoke.yml'
      - 'fm/participate/edge-function.ts'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate public mission contract and one private non-rewarded script intake
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import urllib.parse
          import uuid
          endpoint='https://kbhqacsdvjsstzyplqij.supabase.co/functions/v1/humkin-participation'
          listener=str(uuid.uuid4())
          def call(method,path='',body=None):
              payload=json.dumps(body).encode() if body else None
              headers={'Origin':'https://humkin.abundent.org'}
              if body:headers['Content-Type']='application/json'
              req=urllib.request.Request(endpoint+path,data=payload,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=30) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as exc:
                  return exc.code,json.loads(exc.read())
          status,board=call('GET','?mode=missions')
          assert status==200 and board['schema']=='humkin.participation.v1'
          assert len(board['missions'])>=7
          status,denial=call('POST',body={'action':'submit','listener':listener,'kind':'street',
            'title':'Synthetic street mission','platform':'bluesky','reference_url':'https://bsky.app/profile/example.com/post/test',
            'rights_confirmed':True,'disclosure_confirmed':False})
          assert status==400,(status,denial)
          status,created=call('POST',body={'action':'submit','listener':listener,
            'kind':'script','title':'CI PRIVATE REVIEW TEST — DO NOT ACCEPT',
            'details':'This is a synthetic script generated by the station integration test, not a real contribution.',
            'rights_confirmed':True})
          assert status==200 and created['state']=='pending_review',(status,created)
          print('PARTICIPATION_TEST_ID='+created['id'],flush=True)
          status,mine=call('GET','?mode=mine&listener='+urllib.parse.quote(listener))
          assert status==200 and mine['pending_hum']==35 and mine['verified_hum']==0,mine
          status,removed=call('POST',body={'action':'withdraw','listener':listener,'id':created['id']})
          assert status==200 and removed['withdrawn'],(status,removed)
          print('PASS: guest intake, disclosure refusal, private receipt and withdrawal; no unreviewed credit',flush=True)
          PY
