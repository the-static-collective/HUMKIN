name: HUMKIN Night Shift — draft a larger cloud HOUSE
on:
  pull_request:
    paths:
      - 'tools/radio-broadcast/house_rotation.py'
      - 'tools/radio-broadcast/autopilot_publisher.py'
      - '.github/workflows/night-shift-house-draft.yml'
  workflow_dispatch:
    inputs:
      count:
        description: 'Count of already published, enabled R2 songs to place in a draft HOUSE'
        type: choice
        required: true
        default: '40'
        options:
          - '12'
          - '18'
          - '24'
          - '40'
          - 'FULL'
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build an owner-review DRAFT from current public radio catalog
        shell: bash
        run: |
          # Read-only PR rehearsal verifies the FULL catalog without credentials.
          # Manual owner dispatch still defaults to the ordinary 40-song draft.
          TRACK_COUNT=FULL
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TRACK_COUNT="$(jq -r '.inputs.count' "$GITHUB_EVENT_PATH")"
          fi
          mkdir -p out
          python tools/radio-broadcast/house_rotation.py --count "$TRACK_COUNT" --output out/night-shift-house-selection.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('out/night-shift-house-selection.json').read_text(encoding='utf-8'))
          print('DRAFT ONLY: no cloud audio or playlist writes')
          print('Program entries:',len(p['tracks']))
          if p.get('mode') == 'full_catalog':
              print('Unique songs:',p['song_count'],'Bumper breaks:',p['bumper_break_count'])
              print('Feature-only / held carts:',p['held_bumper_count'])
          print('Estimated house minutes:',round(sum(s['duration_seconds'] for s in p['tracks'])/60,1))
          print('REVIEW FINGERPRINT:',p['fingerprint'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as receipt:
              receipt.write('### Review this HOUSE before publishing\n\n')
              receipt.write('Program entries: '+str(len(p['tracks']))+'\n\n')
              if p.get('mode') == 'full_catalog':
                  receipt.write('Unique songs: '+str(p['song_count'])+' · short/medium/long bumper breaks: '+str(p['bumper_break_count'])+' · held/feature-only bumpers: '+str(p['held_bumper_count'])+'\n\n')
              receipt.write('Copy the 64-character fingerprint into **Night Shift — publish reviewed HOUSE in cloud**:\n\n')
              receipt.write('`'+p['fingerprint']+'`\n\n')
              for n, track in enumerate(p['tracks'],1):
                  lane = '[BUMPER] ' if track.get('kind') == 'bumper' else ''
                  receipt.write(f"{n:03d}. {lane}{track['artist']} — {track['title']}\n")
          for n, track in enumerate(p['tracks'],1):
              print(f"{n:02d}. {track['artist']} — {track['title']}")
          PY
      - name: Preserve editable approved-selection draft for explicit owner review
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-house-selection-draft
          path: out/night-shift-house-selection.json
          retention-days: 14
