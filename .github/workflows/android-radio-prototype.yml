name: Android radio prototype
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-radio-prototype.yml'
  push:
    branches: ['feat/native-android-radio-001']
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-radio-prototype.yml'
jobs:
  debug-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android 16 SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug receiver
        run: gradle -p apps/android --no-daemon :app:assembleDebug :app:assembleFieldTest :app:assembleNightWatch :app:assembleRadioRebel :app:testDebugUnitTest :app:testFieldTestUnitTest :app:testNightWatchUnitTest :app:testRadioRebelUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: humkin-radio-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: humkin-radio-android-field-test
          path: apps/android/app/build/outputs/apk/fieldTest/app-fieldTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: humkin-radio-android-night-watch
          path: apps/android/app/build/outputs/apk/nightWatch/app-nightWatch.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: humkin-radio-android-rebel-027
          path: apps/android/app/build/outputs/apk/radioRebel/app-radioRebel.apk
          if-no-files-found: error
