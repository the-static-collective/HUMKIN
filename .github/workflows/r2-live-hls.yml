name: HUMKIN Tower and HLS validation
on:
  pull_request:
    paths:
      - 'tools/radio-broadcast/**'
      - 'fm/live-station.js'
      - 'fm/index.html'
      - 'tests/hls-*'
      - 'tests/tower.test.py'
      - 'tests/station-on-air.test.py'
      - 'tests/main-live-radio.test.mjs'
      - '.github/workflows/r2-live-hls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Broadcast, cue and queue tests with synthetic audio
        run: |
          python tests/hls-relay.test.py
          python tests/hls-reservoir.test.py
          python tests/hls-encoder-smoke.py
          python tests/station-one-v2.test.py
          python tests/station-on-air.test.py
          python tests/tower.test.py
      - name: Public receiver and Cloudflare routing
        run: |
          node --check tools/radio-broadcast/on_air.js
          node --test tests/main-live-radio.test.mjs tests/radio-primary-layout.test.mjs tools/radio-broadcast/cloudflare/hls-routes.test.mjs tools/radio-broadcast/cloudflare/worker.test.mjs

