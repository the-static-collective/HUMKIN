name: Living Receiver isolated debug APK (experimental)
on:
  push:
    branches: ['review/living-receiver-*']
    paths:
      - 'prototype/LivingReceiver/**'
      - '.github/workflows/living-receiver-debug-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and unit test (no deployment)
        run: gradle -p prototype/LivingReceiver --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify output and print digest
        run: |
          APK=prototype/LivingReceiver/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -6
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: LivingReceiver-v020-service-UNVERIFIED-DEVICE
          path: prototype/LivingReceiver/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
