name: Verify HUMKIN guest-feature role and seasonal boundaries
on:
  pull_request:
    paths:
      - "fm/guest-features.json"
      - "fm/rotation.json"
      - "fm/radio.js"
      - "fm/manage/**"
      - "fm/r2-catalog.js"
      - "tools/radio-broadcast/scheduler_v2.py"
      - "tests/guest-seasonals.test.cjs"
      - "tests/test_guest_seasonals.py"
  push:
    branches: [main]
    paths:
      - "fm/guest-features.json"
      - "fm/rotation.json"
      - "fm/radio.js"
      - "tools/radio-broadcast/scheduler_v2.py"
      - "tests/guest-seasonals.test.cjs"
      - "tests/test_guest_seasonals.py"
jobs:
  guest-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Browser seasonal and feature ordering
        run: node --test tests/guest-seasonals.test.cjs
      - name: Transmitter seasonal and interview-exclusion policy
        run: python3 -m unittest discover -s tests -p 'test_guest_seasonals.py'
