name: Living Relay boundary tests

on:
  pull_request:
    paths:
      - 'living-relic*'
      - 'relics/**'
      - 'tests/living-relay*.test.mjs'
      - 'docs/LIVING-RELAY-001.md'
      - '.github/workflows/living-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check living-relic.js && node --check living-relic.core.mjs && node --check living-relic.porch.js && node --check living-relic.contributions.mjs
      - name: Test relic boundaries
        run: node --test tests/living-relay.test.mjs tests/living-relay-contributions.test.mjs
