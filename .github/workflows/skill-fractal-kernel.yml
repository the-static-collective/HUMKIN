name: HUMKIN skill-fractal kernel
on:
  pull_request:
    paths:
      - 'game/skill-tree/**'
      - 'tests/skill-tree-kernel.test.mjs'
      - 'apps/android/**'
      - '.github/workflows/skill-fractal-kernel.yml'
  push:
    branches: ['experiment/skill-fractal-kernel-001']
    paths:
      - 'game/skill-tree/**'
      - 'tests/skill-tree-kernel.test.mjs'
      - 'apps/android/**'
      - '.github/workflows/skill-fractal-kernel.yml'
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test the shared, design-neutral skill projection
        run: node --test tests/skill-tree-kernel.test.mjs
