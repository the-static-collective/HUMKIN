name: One-time import of user-supplied HaileyLu Bloom MP3
on:
  push:
    branches: [feat/fm-haileylu-bloom-2026-11-13]
    paths:
      - .github/workflows/import-haileylu-bloom.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Store exact uploaded song bytes in the repository
        shell: bash
        env:
          PUBLIC_SOURCE: https://cdn.openart.ai/openart-uploads/production/attachment-transfers/bc074ab72ec23f330ba0abd84d8ac2a758a7968de42c873d32501c12c6826992.mp3
        run: |
          set -euo pipefail
          mkdir -p fm/audio
          if [ -f fm/audio/haileylu-bloom.mp3 ]; then
            echo 'Exact music file already committed.'
            echo '1c92c36b078586a3bc795e4431dd63cec8d0733349d9d61bcec83dbc080aced6  fm/audio/haileylu-bloom.mp3' | sha256sum -c -
            exit 0
          fi
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$PUBLIC_SOURCE" -o fm/audio/haileylu-bloom.mp3
          echo '1c92c36b078586a3bc795e4431dd63cec8d0733349d9d61bcec83dbc080aced6  fm/audio/haileylu-bloom.mp3' | sha256sum -c -
          test "$(stat -c%s fm/audio/haileylu-bloom.mp3)" -eq 3428213
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fm/audio/haileylu-bloom.mp3
          git commit -m 'audio: import exact verified HaileyLu Bloom source from user upload'
          git push origin HEAD:feat/fm-haileylu-bloom-2026-11-13
